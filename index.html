  const [answers, setAnswers] = useState([]);
  const [showHint, setShowHint] = useState(false);
  const [animate, setAnimate] = useState(false);

  useEffect(() => {
    setAnimate(false);
    const t = setTimeout(() => setAnimate(true), 50);
    return () => clearTimeout(t);
  }, [current, phase]);

  const quiz = quizzes[quizIndex];
  const q = quiz.questions[current];
  const score = answers.filter(Boolean).length;
  const total = quiz.questions.length;

  const startQuiz = (idx) => {
    setQuizIndex(idx); setCurrent(0); setSelected(null);
    setConfirmed(false); setAnswers([]); setShowHint(false);
    setPhase("intro");
  };

  const handleConfirm = () => {
    if (selected === null) return;
    const isCorrect = q.choices.find((c) => c.label === selected)?.correct;
    setAnswers([...answers, isCorrect]);
    setConfirmed(true);
  };

  const handleNext = () => {
    if (current + 1 < quiz.questions.length) {
      setCurrent(current + 1); setSelected(null);
      setConfirmed(false); setShowHint(false);
    } else { setPhase("result"); }
  };

  const backToSelect = () => {
    setPhase("select"); setCurrent(0); setSelected(null);
    setConfirmed(false); setAnswers([]); setShowHint(false);
  };

  const resultMessage = () => {
    const pct = score / total;
    if (pct === 1)  return "🎉 パーフェクト！\n謎を完全解明！\n君は数学探偵マスターだ！";
    if (pct >= 0.6) return `👍 ${score}問正解！\n数学の力は十分。\n計算の手順をもう一度確認してみよう。`;
    if (pct >= 0.4) return `💪 ${score}問正解。\nもう一度チャレンジしてみよう！`;
    return "🔁 まだまだこれから！\nでも大丈夫！\n解説を読んで、もう一度挑戦しよう！";
  };

  const root = {
    minHeight: "100vh",
    display: "flex", alignItems: "flex-start", justifyContent: "center",
    padding: "24px 16px",
  };
  const container = {
    width: "100%", maxWidth: 720,
    opacity: animate ? 1 : 0,
    transform: animate ? "translateY(0)" : "translateY(16px)",
    transition: "opacity 0.5s ease, transform 0.5s ease",
  };

  const choiceBtnStyle = (isConfirmed, isCorrect, isSelected) => {
    let bg = C.panel, border = `1px solid ${C.border}`, color = C.text;
    if (isSelected && !isConfirmed) { bg = `${C.accent}22`; border = `1px solid ${C.accent}`; color = C.accent; }
    if (isConfirmed) {
      if (isCorrect) { bg = `${C.correct}22`; border = `1px solid ${C.correct}`; color = C.correct; }
      else if (isSelected) { bg = `${C.wrong}22`; border = `1px solid ${C.wrong}`; color = C.wrong; }
    }
    return {
      background: bg, border, borderRadius: 12, padding: "14px 16px",
      cursor: isConfirmed ? "default" : "pointer",
      display: "flex", alignItems: "center", gap: 12,
      transition: "all 0.2s", color,
      fontFamily: "'Noto Sans JP', sans-serif", fontSize: 14,
      fontWeight: isSelected ? 700 : 400, textAlign: "left", width: "100%",
    };
  };

  const labelDotStyle = (color) => ({
    width: 28, height: 28, borderRadius: "50%",
    background: `${color}33`, border: `1.5px solid ${color}`,
    display: "flex", alignItems: "center", justifyContent: "center",
    fontSize: 12, fontWeight: 800, flexShrink: 0, color,
  });

  return (
    <div style={root}>
      <div style={container}>
        {/* HEADER */}
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <div style={{
            display: "inline-block", background: `linear-gradient(135deg, ${C.accent}, #0090cc)`,
            color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: "0.2em",
            padding: "4px 14px", borderRadius: 20, marginBottom: 12, textTransform: "uppercase",
          }}>🔍 Math Mystery</div>
          <h1 style={{
            fontSize: "clamp(22px, 5vw, 34px)", fontWeight: 900,
            background: `linear-gradient(135deg, ${C.gold}, ${C.accent2})`,
            WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
            margin: "0 0 6px", lineHeight: 1.2,
          }}>謎解き数学ミッション</h1>
          <p style={{ fontSize: 15, color: C.muted }}>中学1年生・総まとめレベル</p>
        </div>

        {/* SELECT */}
        {phase === "select" && (
          <div>
            <p style={{ textAlign: "center", fontSize: 14, color: C.muted, marginBottom: 24, lineHeight: 1.7 }}>
              挑戦する事件を選ぼう。<br />
              長い物語を読み解き、数段階の謎を解いて真相にたどり着け！
            </p>
            {quizzes.map((qz, i) => (
              <div key={qz.id}
                style={{
                  background: C.card, border: `1px solid ${C.border}`, borderRadius: 16,
                  padding: "24px", marginBottom: 16, cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 18,
                  transition: "all 0.25s ease",
                }}
                onClick={() => startQuiz(i)}
                onMouseEnter={(e) => { e.currentTarget.style.borderColor = C.accent; e.currentTarget.style.transform = "translateX(4px)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.transform = "translateX(0)"; }}
              >
                <div style={{
                  fontSize: 36, width: 64, height: 64, borderRadius: 16,
                  background: C.panel, border: `1px solid ${C.border}`,
                  display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                }}>{qz.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: C.text, marginBottom: 8 }}>{qz.subtitle}</div>
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap", fontSize: 12, color: C.muted, alignItems: "center" }}>
                    <span style={{ background: `${C.accent}22`, border: `1px solid ${C.accent}44`, color: C.accent, padding: "2px 10px", borderRadius: 6, fontWeight: 600 }}>{qz.theme}</span>
                    <span>難易度 {qz.difficulty}</span>
                    <span>全{qz.questions.length}問</span>
                  </div>
                </div>
                <div style={{ fontSize: 24, color: C.accent2, flexShrink: 0 }}>›</div>
              </div>
            ))}
          </div>
        )}

        {/* INTRO */}
        {phase === "intro" && (
          <div>
            <button style={{
              background: "transparent", border: "none", color: C.muted,
              fontSize: 13, cursor: "pointer", marginBottom: 16,
              fontFamily: "'Noto Sans JP', sans-serif", padding: 0,
            }} onClick={backToSelect}>‹ 問題選択にもどる</button>
            <div style={{
              background: C.panel, border: `1px solid ${C.border}`, borderRadius: 16,
              padding: "28px 24px", marginBottom: 24, ...glow(C.accent),
            }}>
              <pre style={{
                whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.9,
                color: "#cbd5e1", margin: 0, fontFamily: "'Noto Sans JP', sans-serif",
              }}>{quiz.story}</pre>
            </div>
            <button style={{
              display: "block", width: "100%", padding: "18px",
              background: `linear-gradient(135deg, ${C.accent2}, #e55a2b)`,
              border: "none", borderRadius: 12, color: "#fff",
              fontSize: 18, fontWeight: 800, cursor: "pointer",
              letterSpacing: "0.05em", fontFamily: "'Noto Sans JP', sans-serif",
              ...glow(C.accent2),
            }}
              onMouseEnter={(e) => e.target.style.transform = "scale(1.02)"}
              onMouseLeave={(e) => e.target.style.transform = "scale(1)"}
              onClick={() => setPhase("quiz")}
            >▶ 謎解きスタート！</button>
          </div>
        )}

        {/* QUIZ */}
        {phase === "quiz" && (
          <div>
            {/* Progress bar */}
            <div style={{ height: 4, background: C.border, borderRadius: 4, marginBottom: 24, overflow: "hidden" }}>
              <div style={{
                height: "100%",
                width: `${((current + (confirmed ? 1 : 0)) / total) * 100}%`,
                background: `linear-gradient(90deg, ${C.accent}, ${C.accent2})`,
                borderRadius: 4, transition: "width 0.4s ease",
              }} />
            </div>

            <div style={{
              display: "inline-flex", alignItems: "center", gap: 8,
              background: `${C.accent}22`, border: `1px solid ${C.accent}66`,
              borderRadius: 8, padding: "4px 14px", fontSize: 12, fontWeight: 700,
              color: C.accent, letterSpacing: "0.1em", marginBottom: 16,
            }}>
              🔬 {q.stage} / {total}問中 {q.id}問目 ― {q.label}
            </div>

            {/* Question card */}
            <div style={{
              background: C.card, border: `1px solid ${C.border}`,
              borderRadius: 16, padding: "24px", marginBottom: 16,
            }}>
              <div style={{ fontSize: 12, color: C.muted, fontWeight: 600, marginBottom: 8, letterSpacing: "0.1em" }}>【問題】</div>
              <pre style={{ fontSize: 15, lineHeight: 1.8, whiteSpace: "pre-wrap", color: C.text, margin: 0, fontFamily: "'Noto Sans JP', sans-serif" }}>{q.question}</pre>
              {!confirmed && (
                <button style={{
                  background: "transparent", border: `1px dashed ${C.muted}`, color: C.muted,
                  fontSize: 12, padding: "6px 16px", borderRadius: 8, cursor: "pointer",
                  marginTop: 12, fontFamily: "'Noto Sans JP', sans-serif",
                }} onClick={() => setShowHint(!showHint)}>
                  {showHint ? "▲ ヒントを隠す" : "💡 ヒントを見る"}
                </button>
              )}
              {showHint && !confirmed && (
                <div style={{
                  marginTop: 12, padding: "12px 16px",
                  background: `${C.gold}11`, border: `1px solid ${C.gold}44`,
                  borderRadius: 10, fontSize: 13, color: C.gold, whiteSpace: "pre-wrap",
                }}>💡 ヒント：{q.hint}</div>
              )}
            </div>

            {/* Choices */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
              {q.choices.map((c) => {
                const isSel = selected === c.label;
                const labelColor = confirmed
                  ? c.correct ? C.correct : isSel ? C.wrong : C.muted
                  : isSel ? C.accent : C.muted;
                return (
                  <button key={c.label}
                    style={choiceBtnStyle(confirmed, c.correct, isSel)}
                    onClick={() => !confirmed && setSelected(c.label)}
                  >
                    <div style={labelDotStyle(labelColor)}>
                      {confirmed && c.correct ? "✓" : confirmed && isSel && !c.correct ? "✗" : c.label}
                    </div>
                    <span>{c.value}</span>
                  </button>
                );
              })}
            </div>

            {!confirmed && (
              <button style={{
                width: "100%", padding: "16px",
                background: selected === null ? C.muted : `linear-gradient(135deg, ${C.accent}, #0090cc)`,
                border: "none", borderRadius: 12, color: "#fff",
                fontSize: 16, fontWeight: 800,
                cursor: selected === null ? "not-allowed" : "pointer",
                fontFamily: "'Noto Sans JP', sans-serif",
                letterSpacing: "0.05em", marginBottom: 12,
                transition: "all 0.2s",
              }} onClick={handleConfirm}>
                {selected ? "✅ この答えで決定！" : "選択してください"}
              </button>
            )}

            {confirmed && (
              <div>
                {!answers[answers.length - 1] && (
                  <div style={{
                    background: `${C.wrong}11`, border: `1px solid ${C.wrong}44`,
                    borderRadius: 12, padding: "12px 16px", marginBottom: 12,
                    fontSize: 14, color: "#fca5a5",
                  }}>❌ 不正解… でも大丈夫！解説を読もう。</div>
                )}
                <div style={{
                  background: `${C.correct}11`, border: `1px solid ${C.correct}44`,
                  borderRadius: 12, padding: "16px 20px", marginBottom: 12,
                  fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap", color: "#86efac",
                }}>
                  {answers[answers.length - 1] ? "✅ 正解！\n\n" : ""}{q.explanation}
                </div>
                <button style={{
                  width: "100%", padding: "16px",
                  background: `linear-gradient(135deg, ${C.accent2}, #e55a2b)`,
                  border: "none", borderRadius: 12, color: "#fff",
                  fontSize: 16, fontWeight: 800, cursor: "pointer",
                  fontFamily: "'Noto Sans JP', sans-serif",
                  letterSpacing: "0.05em", ...glow(C.accent2),
                }} onClick={handleNext}>
                  {current + 1 < total ? "▶ 次の問題へ" : "🏁 結果を見る"}
                </button>
              </div>
            )}
          </div>
        )}

        {/* RESULT */}
        {phase === "result" && (
          <div style={{
            textAlign: "center", background: C.card,
            border: `1px solid ${C.border}`, borderRadius: 20,
            padding: "40px 28px", ...glow(C.gold),
          }}>
            <div style={{ fontSize: 40 }}>{quiz.icon}</div>
            <div style={{ fontSize: 13, color: C.muted, marginTop: 8, letterSpacing: "0.15em" }}>MISSION RESULT</div>
            <div style={{
              fontSize: 72, fontWeight: 900,
              background: `linear-gradient(135deg, ${C.gold}, ${C.accent2})`,
              WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
              lineHeight: 1, margin: "16px 0",
            }}>{score}/{total}</div>

            <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 28, flexWrap: "wrap" }}>
              {answers.map((ok, i) => (
                <div key={i} style={{
                  width: 44, height: 44, borderRadius: "50%",
                  background: ok ? `${C.correct}33` : `${C.wrong}33`,
                  border: `2px solid ${ok ? C.correct : C.wrong}`,
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18,
                }}>{ok ? "✓" : "✗"}</div>
              ))}
            </div>

            <p style={{ fontSize: 16, lineHeight: 1.8, color: "#cbd5e1", marginBottom: 28, whiteSpace: "pre-wrap" }}>
              {resultMessage()}
            </p>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
              <button style={{
                padding: "14px 28px",
                background: `linear-gradient(135deg, ${C.accent}, #0090cc)`,
                border: "none", borderRadius: 12, color: "#fff",
                fontSize: 15, fontWeight: 800, cursor: "pointer",
                fontFamily: "'Noto Sans JP', sans-serif", ...glow(C.accent),
              }} onClick={() => startQuiz(quizIndex)}>🔄 もう一度</button>
              <button style={{
                padding: "14px 28px", background: "transparent",
                border: `1px solid ${C.border}`, borderRadius: 12, color: C.text,
                fontSize: 15, fontWeight: 700, cursor: "pointer",
                fontFamily: "'Noto Sans JP', sans-serif",
              }} onClick={backToSelect}>📋 問題を選ぶ</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
